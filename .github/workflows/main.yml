name: Build VPN Control APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Locate project
        shell: bash
        run: |
          set -euxo pipefail
          test -f project/VPN-Control/app/build.gradle.kts
          test -f project/VPN-Control/settings.gradle.kts

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --version
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle version
        shell: bash
        run: |
          set -euxo pipefail
          test "$(gradle --version | awk '/^Gradle / {print $2; exit}')" = "8.13"

      - name: Build debug APK
        working-directory: project/VPN-Control
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Control-0.4.3-debug
          path: project/VPN-Control/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
