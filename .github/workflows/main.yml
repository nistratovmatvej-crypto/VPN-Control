
name: main.yml

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        shell: bash
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "Android SDK manager not found!"
            find "$ANDROID_HOME" -name sdkmanager -type f
            exit 1
          fi

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract project
        shell: bash
        run: |
          mkdir -p project
          unzip -o vpn-control.zip -d project

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          GRADLE_FILE=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "Gradle wrapper not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$GRADLE_FILE"

      - name: Update Gradle Wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find project -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK file not found!"
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Control-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          
