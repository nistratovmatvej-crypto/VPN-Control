
name: Build VPN Control APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses

      - name: Extract project
        shell: bash
        run: |
          mkdir -p project
          unzip -o vpn-control.zip -d project

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          GRADLE_FILE=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle wrapper not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$GRADLE_FILE"

      - name: Update Gradle Wrapper
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          PROPERTIES="gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$PROPERTIES" ]; then
            echo "ERROR: gradle-wrapper.properties not found!"
            exit 1
          fi

          sed -i \
            's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip|' \
            "$PROPERTIES"

          sed -i '/^distributionSha256Sum=/d' "$PROPERTIES"

          cat "$PROPERTIES"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Control-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
