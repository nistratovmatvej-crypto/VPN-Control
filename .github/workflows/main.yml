name: Build VPN Control APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -type f | head -n 100 || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          test -f vpn-control.zip || { echo "ERROR: vpn-control.zip not found"; exit 1; }
          mkdir -p project
          unzip -o vpn-control.zip -d project

      - name: Inspect Kotlin sources before patching
        shell: bash
        run: |
          set -euo pipefail
          find project -name MainActivity.kt -o -name WireGuardControllerService.kt
          MAIN="$(find project -name MainActivity.kt -print -quit)"
          WG="$(find project -name WireGuardControllerService.kt -print -quit)"
          echo "===== MainActivity.kt lines 1-180 ====="
          sed -n '1,180p' "$MAIN"
          echo "===== WireGuardControllerService.kt lines 1-190 ====="
          sed -n '1,190p' "$WG"

      - name: Patch Kotlin API compatibility
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$(find project -name MainActivity.kt -print -quit)"
          WG="$(find project -name WireGuardControllerService.kt -print -quit)"
          test -n "$MAIN" && test -n "$WG"
          sed -i '/^[[:space:]]*private fun line(/c\    private fun line(a: String, b: String, color: Int = muted): View {\n        return LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(8), 0, dp(8)); addView(text(a, 14f, white, true), LinearLayout.LayoutParams(0, -2, 1f)); addView(text(b, 13f, color, true)) }\n    }' "$MAIN"
          perl -0pi -e 's/engine\.getLastHandshake\(tunnel\)/lastHandshakeEpoch(engine)/g; s/GoBackend\(context\.applicationContext\)/GoBackend(context.applicationContext, null)/g; s/fun tunnelCounters\(\): Pair<Long, Long>\? = null/fun tunnelCounters(): Pair<Long, Long>? {\n            return try {\n                val b = sharedBackend ?: return null\n                val stateMethod = b.javaClass.methods.firstOrNull { it.name == "getState" && it.parameterCount == 1 } ?: return null\n                if (stateMethod.invoke(b, tunnel) != Tunnel.State.UP) return null\n                val statsMethod = b.javaClass.methods.firstOrNull { it.name == "getStatistics" && it.parameterCount == 1 } ?: return null\n                val stats = statsMethod.invoke(b, tunnel) ?: return null\n                val rxMethod = stats.javaClass.methods.firstOrNull { it.name == "totalRx" && it.parameterCount == 0 } ?: return null\n                val txMethod = stats.javaClass.methods.firstOrNull { it.name == "totalTx" && it.parameterCount == 0 } ?: return null\n                val rx = rxMethod.invoke(stats) as? Number ?: return null\n                val tx = txMethod.invoke(stats) as? Number ?: return null\n                Pair(rx.toLong(), tx.toLong())\n            } catch (_: Exception) { null }\n        }/s' "$WG"
          sed -i '/private fun backend(): GoBackend/i\    private fun lastHandshakeEpoch(engine: GoBackend): Long = try {\n        val method = engine.javaClass.methods.firstOrNull { it.name == "getLastHandshake" && it.parameterCount == 1 } ?: return 0L\n        (method.invoke(engine, tunnel) as? Number)?.toLong() ?: 0L\n    } catch (_: Exception) { 0L }\n' "$WG"
          echo "Compatibility patch applied"
          grep -n 'private fun line\|lastHandshakeEpoch\|getLastHandshake' "$MAIN" "$WG" || true

      - name: Add polished launcher icon
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$(find project -path '*/src/main/AndroidManifest.xml' -print -quit)"
          test -n "$MANIFEST"
          APP_DIR="$(dirname "$MANIFEST")"
          if ! grep -q 'xmlns:tools=' "$MANIFEST"; then
            sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MANIFEST"
          fi
          sed -i 's|<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />|<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />|' "$MANIFEST"
          sed -i 's|org.amnezia.awg.backend.GoBackend\$VpnService|org.amnezia.awg.backend.AbstractBackend\$VpnService|' "$MANIFEST"
          awk '/<service/ { in_service=1 } in_service && /org.amnezia.awg.backend.AbstractBackend[$]VpnService/ { target=1 } target { gsub(/android:exported="true"/, "android:exported=\"false\"") } in_service && index($0, "</service>") { in_service=0; target=0 } { print }' "$MANIFEST" > "$MANIFEST.tmp"
          mv "$MANIFEST.tmp" "$MANIFEST"
          mkdir -p "$APP_DIR/res/drawable"
          cat > "$APP_DIR/res/drawable/ic_vpn_control.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#101827" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#FFB45C" android:pathData="M54,7 L96,22 L96,49 C96,74 79,92 54,103 C29,92 12,74 12,49 L12,22 Z"/>
              <path android:fillColor="#172338" android:pathData="M54,18 L85,29 L85,49 C85,68 72,82 54,91 C36,82 23,68 23,49 L23,29 Z"/>
              <path android:fillColor="#5BD6A0" android:pathData="M31,47 L39,47 L39,61 L31,61 Z M69,47 L77,47 L77,61 L69,61 Z"/>
              <path android:fillColor="#F4F6FC" android:pathData="M42,39 L50,39 L50,69 L42,69 Z M58,39 L66,39 L66,69 L58,69 Z M42,35 L66,35 L66,43 L42,43 Z M42,65 L66,65 L66,73 L42,73 Z"/>
              <path android:fillColor="#5BD6A0" android:pathData="M47,47 L61,47 L61,61 L47,61 Z"/>
          </vector>
          EOF
          if grep -q 'android:icon=' "$MANIFEST"; then
            sed -i 's/android:icon="[^"]*"/android:icon="@drawable\/ic_vpn_control"/' "$MANIFEST"
          else
            sed -i 's/<application/<application android:icon="@drawable\/ic_vpn_control"/' "$MANIFEST"
          fi
          echo "Launcher icon configured in $MANIFEST"

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found in archive"
            find project -maxdepth 5 -type f | head -n 200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run Android tests and lint
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Verify launcher metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find project -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -print -quit)"
          test -n "$APK" && test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/vpn-badging.txt
          grep -q '^launchable-activity:' /tmp/vpn-badging.txt
          grep -q '^application-icon-' /tmp/vpn-badging.txt
          echo "APK contains launcher activity and application icon."

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find project -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not produced"
            find project -type d -path '*/build/outputs/*' -print
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Control-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
