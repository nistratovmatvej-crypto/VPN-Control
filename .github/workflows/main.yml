name: Build VPN Control APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -type f | head -n 100 || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          test -f vpn-control.zip || { echo "ERROR: vpn-control.zip not found"; exit 1; }
          mkdir -p project
          unzip -o vpn-control.zip -d project

      - name: Inspect Kotlin sources before patching
        shell: bash
        run: |
          set -euo pipefail
          find project -name MainActivity.kt -o -name WireGuardControllerService.kt
          MAIN="$(find project -name MainActivity.kt -print -quit)"
          WG="$(find project -name WireGuardControllerService.kt -print -quit)"
          echo "===== MainActivity.kt lines 1-180 ====="
          sed -n '1,180p' "$MAIN"
          echo "===== WireGuardControllerService.kt lines 1-190 ====="
          sed -n '1,190p' "$WG"

      - name: Patch Kotlin API compatibility
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$(find project -name MainActivity.kt -print -quit)"
          WG="$(find project -name WireGuardControllerService.kt -print -quit)"
          test -n "$MAIN" && test -n "$WG"
          perl -0pi -e 's/private fun line\(a:String,b:String,color:Int=muted\) \{ val r=LinearLayout\(this\)\.apply \{ orientation=LinearLayout\.HORIZONTAL; gravity=Gravity\.CENTER_VERTICAL; setPadding\(0,dp\(8\),0,dp\(8\)\); addView\(text\(a,14f,white,true\),LinearLayout\.LayoutParams\(0,-2,1f\)\); addView\(text\(b,13f,color,true\)) \}; body\.addView\(r\) \}/private fun line(a:String,b:String,color:Int=muted): View = LinearLayout(this).apply { orientation=LinearLayout.HORIZONTAL; gravity=Gravity.CENTER_VERTICAL; setPadding(0,dp(8),0,dp(8)); addView(text(a,14f,white,true),LinearLayout.LayoutParams(0,-2,1f)); addView(text(b,13f,color,true)) }/' "$MAIN"
          perl -0pi -e 's/val s = b\.getStatistics\(tunnel\)\s*Pair\(s\.totalRx\(\), s\.totalTx\(\)\)/return null/' "$WG"
          perl -0pi -e 's/engine\.getLastHandshake\(tunnel\)/0L/g' "$WG"
          echo "Patched line() return type and removed unsupported AWG API calls"
          grep -n 'private fun line' "$MAIN"
          grep -n 'getLastHandshake\|totalRx()\|totalTx()' "$WG" || true

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found in archive"
            find project -maxdepth 5 -type f | head -n 200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find project -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not produced"
            find project -type d -path '*/build/outputs/*' -print
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Control-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
