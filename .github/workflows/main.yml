name: Build VPN Control APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -type f | head -n 100 || true
            exit 1
          fi
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          test -f vpn-control.zip || { echo "ERROR: vpn-control.zip not found"; exit 1; }
          mkdir -p project
          unzip -o vpn-control.zip -d project

      - name: Inspect Kotlin sources before patching
        shell: bash
        run: |
          set -euo pipefail
          find project -name MainActivity.kt -o -name WireGuardControllerService.kt
          MAIN="$(find project -name MainActivity.kt -print -quit)"
          WG="$(find project -name WireGuardControllerService.kt -print -quit)"
          echo "===== MainActivity.kt lines 1-180 ====="
          sed -n '1,180p' "$MAIN"
          echo "===== WireGuardControllerService.kt lines 1-190 ====="
          sed -n '1,190p' "$WG"

      - name: Patch runtime-critical Android integration
        shell: bash
        run: |
          set -euo pipefail
          MAIN="$(find project -name MainActivity.kt -print -quit)"
          WG="$(find project -name WireGuardControllerService.kt -print -quit)"
          MON="$(find project -name AppMonitorService.kt -print -quit)"
          MANIFEST="$(find project -path '*/src/main/AndroidManifest.xml' -print -quit)"
          test -n "$MAIN" && test -n "$WG" && test -n "$MON" && test -n "$MANIFEST"

          # Android UI helper must return the constructed View.
          sed -i '/^[[:space:]]*private fun line(/c\\    private fun line(a: String, b: String, color: Int = muted): View {\\n        return LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(8), 0, dp(8)); addView(text(a, 14f, white, true), LinearLayout.LayoutParams(0, -2, 1f)); addView(text(b, 13f, color, true)) }\\n    }' "$MAIN"

          # The library requires a TunnelActionHandler. A null handler is not safe at runtime.
          grep -q 'import org.amnezia.awg.backend.NoopTunnelActionHandler' "$WG" || sed -i '/import org.amnezia.awg.backend.GoBackend/a import org.amnezia.awg.backend.NoopTunnelActionHandler' "$WG"
          sed -i 's/GoBackend(context.applicationContext)/GoBackend(context.applicationContext, NoopTunnelActionHandler())/' "$WG"

          # Keep the normal connection as a real full-tunnel profile. App routing is opt-in.
          perl -0pi -e 's/private fun configForActiveProfile\(\): Config \{.*?\n    \}\n\n    private fun connectActiveProfile/private fun configForActiveProfile(): Config {\n        val original = ConfigStore.decrypt(File(filesDir, "active.enc").readBytes()).toString(Charsets.UTF_8)\n        val prefs = getSharedPreferences("vpncontrol", MODE_PRIVATE)\n        if (!prefs.getBoolean("splitTunnelEnabled", false)) {\n            return ByteArrayInputStream(original.toByteArray(Charsets.UTF_8)).use { Config.parse(it) }\n        }\n        val selected = listOf(\n            "org.telegram.messenger" to prefs.getBoolean("ruleTelegram", true),\n            "com.google.android.youtube" to prefs.getBoolean("ruleYoutube", true),\n            "com.anthropic.claude" to prefs.getBoolean("ruleClaude", false)\n        ).filter { it.second }.map { it.first }.filter { pkg ->\n            try { packageManager.getApplicationInfo(pkg, 0); true } catch (_: Exception) { false }\n        }\n        require(selected.isNotEmpty()) { "В раздельном режиме выбери хотя бы одно установленное приложение" }\n        val withoutOldRules = original.replace(Regex("(?im)^(IncludedApplications|ExcludedApplications)\\\\s*=.*(?:\\\\r?\\\\n|$)"), "")\n        val routed = Regex("(?im)^\\\\[Interface]\\\\s*$").replaceFirst(withoutOldRules,\n            "[Interface]\\\\nIncludedApplications = ${selected.joinToString(", ")}")\n        return ByteArrayInputStream(routed.toByteArray(Charsets.UTF_8)).use { Config.parse(it) }\n    }\n\n    private fun connectActiveProfile/sms' "$WG"

          # Use reflection for optional backend statistics/handshake APIs across AWG library revisions.
          perl -0pi -e 's/engine\\.getLastHandshake\\(tunnel\\)/lastHandshakeEpoch(engine)/g; s/fun tunnelCounters\\(\\): Pair<Long, Long>\\? = null/fun tunnelCounters(): Pair<Long, Long>? {\n            return try {\n                val b = sharedBackend ?: return null\n                val state = b.javaClass.methods.firstOrNull { it.name == "getState" && it.parameterCount == 1 } ?: return null\n                if (state.invoke(b, tunnel) != Tunnel.State.UP) return null\n                val statsMethod = b.javaClass.methods.firstOrNull { it.name == "getStatistics" && it.parameterCount == 1 } ?: return null\n                val stats = statsMethod.invoke(b, tunnel) ?: return null\n                val rx = stats.javaClass.methods.firstOrNull { it.name == "totalRx" && it.parameterCount == 0 }?.invoke(stats) as? Number ?: return null\n                val tx = stats.javaClass.methods.firstOrNull { it.name == "totalTx" && it.parameterCount == 0 }?.invoke(stats) as? Number ?: return null\n                Pair(rx.toLong(), tx.toLong())\n            } catch (_: Exception) { null }\n        }/s' "$WG"
          if ! grep -q 'private fun lastHandshakeEpoch' "$WG"; then
            sed -i '/private fun backend()/i\\    private fun lastHandshakeEpoch(engine: GoBackend): Long = try {\\n        val method = engine.javaClass.methods.firstOrNull { it.name == "getLastHandshake" && it.parameterCount == 1 } ?: return 0L\\n        (method.invoke(engine, tunnel) as? Number)?.toLong() ?: 0L\\n    } catch (_: Exception) { 0L }\\n' "$WG"
          fi

          # Don't publish a successful state before the backend actually accepts the command.
          sed -i 's/;prefs.edit().putBoolean("vpnWasStarted",true).apply()//' "$MAIN"
          sed -i 's/;prefs.edit().putBoolean("vpnWasStarted",false).apply()//' "$MAIN"
          sed -i 's/prefs.edit().putBoolean("vpnWasStarted",effectiveEnabled).apply()/\/\/ The controller service records state only after backend success./' "$MON"

          # App routing is opt-in; expose the mode rather than silently forcing a three-app tunnel.
          perl -0pi -e 's/(val c=card\(\); c\.addView\(text\("Для каждого приложения можно отдельно включить или выключить правило\. Android требует разрешение «Доступ к статистике использования»\.",12f,muted\)\))/$1\n        val splitRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; gravity = Gravity.CENTER_VERTICAL; setPadding(0, dp(8), 0, dp(8)); addView(text("Раздельный туннель · только выбранные приложения", 12f, white, true), LinearLayout.LayoutParams(0, -2, 1f)); addView(Switch(this@MainActivity).apply { isChecked = prefs.getBoolean("splitTunnelEnabled", false); setOnCheckedChangeListener { _, enabled -> prefs.edit().putBoolean("splitTunnelEnabled", enabled).apply() } }) }; c.addView(splitRow)/' "$MAIN"

          # The system binds this protected service; keep it exported with BIND_VPN_SERVICE.
          sed -i 's|org.amnezia.awg.backend.GoBackend\\$VpnService|org.amnezia.awg.backend.AbstractBackend\\$VpnService|' "$MANIFEST"
          if ! grep -q 'xmlns:tools=' "$MANIFEST"; then sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MANIFEST"; fi
          sed -i 's|<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />|<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />|' "$MANIFEST"

          APP_DIR="$(dirname "$MANIFEST")"
          mkdir -p "$APP_DIR/res/drawable"
          cat > "$APP_DIR/res/drawable/ic_vpn_control.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#101827" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFB45C" android:pathData="M54,7 L96,22 L96,49 C96,74 79,92 54,103 C29,92 12,74 12,49 L12,22 Z"/>
            <path android:fillColor="#172338" android:pathData="M54,18 L85,29 L85,49 C85,68 72,82 54,91 C36,82 23,68 23,49 L23,29 Z"/>
            <path android:fillColor="#5BD6A0" android:pathData="M31,47 L39,47 L39,61 L31,61 Z M69,47 L77,47 L77,61 L69,61 Z"/>
            <path android:fillColor="#F4F6FC" android:pathData="M42,39 L50,39 L50,69 L42,69 Z M58,39 L66,39 L66,69 L58,69 Z M42,35 L66,35 L66,43 L42,43 Z M42,65 L66,65 L66,73 L42,73 Z"/>
            <path android:fillColor="#5BD6A0" android:pathData="M47,47 L61,47 L61,61 L47,61 Z"/>
          </vector>
          EOF
          if grep -q 'android:icon=' "$MANIFEST"; then sed -i 's/android:icon="[^"]*"/android:icon="@drawable\\/ic_vpn_control"/' "$MANIFEST"; else sed -i 's/<application/<application android:icon="@drawable\\/ic_vpn_control"/' "$MANIFEST"; fi
          echo "Runtime compatibility, full-tunnel default, optional split routing and launcher icon configured."

      - name: Locate Gradle project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found in archive"
            find project -maxdepth 5 -type f | head -n 200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run Android tests and lint
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Verify launcher metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find project -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -print -quit)"
          test -n "$APK" && test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/vpn-badging.txt
          grep -q '^launchable-activity:' /tmp/vpn-badging.txt
          grep -q '^application-icon-' /tmp/vpn-badging.txt
          echo "APK contains launcher activity and application icon."

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find project -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not produced"
            find project -type d -path '*/build/outputs/*' -print
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPN-Control-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
