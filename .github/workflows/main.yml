name: Build VPN Control APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WARP_HAIKU_CONFIG_B64: ${{ secrets.WARP_HAIKU_CONFIG_B64 }}
      WARP_TANKA_CONFIG_B64: ${{ secrets.WARP_TANKA_CONFIG_B64 }}
      WARP_SONNET_CONFIG_B64: ${{ secrets.WARP_SONNET_CONFIG_B64 }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 5 -type f | head -n 100 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare source tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f app/build.gradle.kts ] && [ -f settings.gradle.kts ]; then
            echo "Using committed Android source tree"
            echo "dir=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          else
            test -f vpn-control.zip || { echo "ERROR: vpn-control.zip not found"; exit 1; }
            mkdir -p project
            unzip -o vpn-control.zip -d project
            SRC="$(find project -type f -name settings.gradle.kts -print -quit | xargs dirname)"
            test -f "$SRC/app/build.gradle.kts"
            echo "dir=$GITHUB_WORKSPACE/$SRC" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch runtime-critical Android integration
        shell: bash
        env:
          SRC_ROOT: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail
          MAIN="$(find "$SRC_ROOT" -name MainActivity.kt -print -quit)"
          WG="$(find "$SRC_ROOT" -name WireGuardControllerService.kt -print -quit)"
          MON="$(find "$SRC_ROOT" -name AppMonitorService.kt -print -quit)"
          MANIFEST="$(find "$SRC_ROOT" -path '*/src/main/AndroidManifest.xml' -print -quit)"
          GRADLE="$(find "$SRC_ROOT" -path '*/app/build.gradle.kts' -print -quit)"
          test -n "$MAIN" && test -n "$WG" && test -n "$MON" && test -n "$MANIFEST" && test -n "$GRADLE"

          # The original helper returned Unit and caused an invalid Android view hierarchy.
          # The committed line() helper already returns a View; do not rewrite its body in CI.

          # The AWG backend requires a real TunnelActionHandler instance.
          grep -q 'import org.amnezia.awg.backend.NoopTunnelActionHandler' "$WG" || sed -i '/import org.amnezia.awg.backend.GoBackend/a import org.amnezia.awg.backend.NoopTunnelActionHandler' "$WG"
          sed -i 's/GoBackend(context.applicationContext)/GoBackend(context.applicationContext, NoopTunnelActionHandler())/' "$WG"

          # Never silently force a fixed list of three apps into every VPN connection.
          # Keep the committed configForActiveProfile implementation; it applies app routing and DNS.

          # Handshake API differs between AWG library revisions; resolve it safely at runtime.
          sed -i 's/engine.getLastHandshake(tunnel)/lastHandshakeEpoch(engine)/g' "$WG"
          if ! grep -q 'private fun lastHandshakeEpoch' "$WG"; then
            sed -i '/private fun backend()/i\    private fun lastHandshakeEpoch(engine: GoBackend): Long = try {\n        val method = engine.javaClass.methods.firstOrNull { it.name == "getLastHandshake" && it.parameterCount == 1 } ?: return 0L\n        (method.invoke(engine, tunnel) as? Number)?.toLong() ?: 0L\n    } catch (_: Exception) { 0L }\n' "$WG"
          fi

          # The controller is the only source of truth for connected/disconnected state.
          sed -i 's/;prefs.edit().putBoolean("vpnWasStarted",false).apply()}/}/' "$MAIN"
          sed -i 's/prefs.edit().putBoolean("vpnWasStarted", effectiveEnabled).apply()/\/\/ state is committed by WireGuardControllerService/' "$MON"

          # The library declares the protected VPN service non-exported; match it to avoid a manifest merge conflict.
          sed -i 's|org.amnezia.awg.backend.GoBackend\$VpnService|org.amnezia.awg.backend.AbstractBackend\$VpnService|' "$MANIFEST"
          sed -i '/AbstractBackend\$VpnService/,+8 s/android:exported="true"/android:exported="false"/' "$MANIFEST"
          if ! grep -q 'xmlns:tools=' "$MANIFEST"; then
            sed -i 's|<manifest |<manifest xmlns:tools="http://schemas.android.com/tools" |' "$MANIFEST"
          fi
          sed -i 's|<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />|<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />|' "$MANIFEST"

          # Version the actual app, not only the CI artifact.
          sed -i 's/versionCode = 6/versionCode = 7/; s/versionName = "0.4.3"/versionName = "0.4.4"/' "$GRADLE"
          sed -i 's/NETWORK CONTROL CENTER  ·  0.4.1/NETWORK CONTROL CENTER  ·  0.4.4/; s/VPN Control 0.4.1 · AmneziaWG/VPN Control 0.4.4 · AmneziaWG/' "$MAIN"

          APP_DIR="$(dirname "$MANIFEST")"
          mkdir -p "$APP_DIR/res/drawable"
          cat > "$APP_DIR/res/drawable/ic_vpn_control.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#111015" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#9B6DFF" android:pathData="M54,7 L94,22 L94,49 C94,74 78,92 54,102 C30,92 14,74 14,49 L14,22 Z"/>
            <path android:fillColor="#17131F" android:pathData="M54,17 L84,28 L84,49 C84,67 72,81 54,91 C36,81 24,67 24,49 L24,28 Z"/>
            <path android:fillColor="#B18AFF" android:pathData="M59,25 L39,57 L52,57 L46,82 L70,47 L56,47 Z"/>
            <path android:fillColor="#F6F2FA" android:pathData="M54,11 L90,24 L90,30 L54,18 L18,30 L18,24 Z"/>
          </vector>
          EOF
          if grep -q 'android:icon=' "$MANIFEST"; then
            sed -i 's|android:icon="[^"]*"|android:icon="@drawable/ic_vpn_control"|' "$MANIFEST"
          else
            sed -i 's|<application|<application android:icon="@drawable/ic_vpn_control"|' "$MANIFEST"
          fi
          echo "Applied runtime fixes and release metadata."

      - name: Locate Gradle project
        id: project
        shell: bash
        env:
          SRC_ROOT: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail
          GRADLE_FILE="$(find "$SRC_ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$GRADLE_FILE"
          PROJECT_DIR="$(dirname "$GRADLE_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Gradle project: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          test "$(gradle --version | awk '/^Gradle / {print $2; exit}')" = "8.13"

      - name: Restore stable debug signing key
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          KEY="$PROJECT_DIR/signing/vpn-control-debug.keystore"
          mkdir -p "$(dirname "$KEY")"
          base64 --decode "$GITHUB_WORKSPACE/signing/vpn-control-debug.keystore.base64" > "$KEY"
          keytool -list -keystore "$KEY" -storepass vpncontrol-debug-only -alias vpncontrol >/dev/null
          echo "Stable signing key restored."

      - name: Validate built-in VPN profiles
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WARP_HAIKU_CONFIG_B64"
          test -n "$WARP_TANKA_CONFIG_B64"
          test -n "$WARP_SONNET_CONFIG_B64"
          for value in "$WARP_HAIKU_CONFIG_B64" "$WARP_TANKA_CONFIG_B64" "$WARP_SONNET_CONFIG_B64"; do
            decoded="$(printf '%s' "$value" | base64 --decode)"
            grep -Fq '[Interface]' <<< "$decoded"
            grep -Fq '[Peer]' <<< "$decoded"
            grep -Eq '^PrivateKey[[:space:]]*=' <<< "$decoded"
            grep -Eq '^PublicKey[[:space:]]*=' <<< "$decoded"
            grep -Eq '^Endpoint[[:space:]]*=' <<< "$decoded"
            unset decoded
          done
          echo "Three embedded VPN profiles validated."

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Run Android tests and lint
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Apply legacy-compatible APK signature
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -print -quit)"
          KEY="$PROJECT_DIR/signing/vpn-control-debug.keystore"
          test -s "$APK" && test -x "$APKSIGNER" && test -s "$KEY"
          "$APKSIGNER" sign --ks "$KEY" --ks-key-alias vpncontrol \
            --ks-pass pass:vpncontrol-debug-only --key-pass pass:vpncontrol-debug-only \
            --v1-signing-enabled true --v2-signing-enabled true \
            --out "$APK.signed" "$APK"
          mv "$APK.signed" "$APK"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Verify VPN integration and launcher metadata
        shell: bash
        env:
          SRC_ROOT: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail
          MANIFEST="$(find "$SRC_ROOT" -path '*/src/main/AndroidManifest.xml' -print -quit)"
          WG="$(find "$SRC_ROOT" -name WireGuardControllerService.kt -print -quit)"
          MAIN="$(find "$SRC_ROOT" -name MainActivity.kt -print -quit)"
          grep -Fq 'org.amnezia.awg.backend.AbstractBackend$VpnService' "$MANIFEST"
          grep -Fq 'android.permission.BIND_VPN_SERVICE' "$MANIFEST"
          grep -Fq 'NoopTunnelActionHandler()' "$WG"
          grep -Fq 'lastHandshakeEpoch(engine)' "$WG"
          ! grep -Fq 'putBoolean("vpnWasStarted", effectiveEnabled)' "$(find "$SRC_ROOT" -name AppMonitorService.kt -print -quit)"
          grep -Fq '0.6.0' "$MAIN"
          APK="$(find "$SRC_ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt -print -quit)"
          test -n "$APK" && test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee /tmp/vpn-badging.txt
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner -print -quit)"
          test -n "$APKSIGNER"
          SIGNATURE="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE"
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' <<< "$SIGNATURE"
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' <<< "$SIGNATURE"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libam-go.so'
          echo "APK signature and ARM64 native runtime verified."
          grep -q "^launchable-activity:" /tmp/vpn-badging.txt
          grep -q "^application-icon-" /tmp/vpn-badging.txt
          grep -q "versionName='0.6.0'" /tmp/vpn-badging.txt
          echo "APK metadata and runtime integration checks passed."

      - name: Promote patched Android source into repository
        if: success()
        shell: bash
        env:
          SRC_ROOT: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail
          case "$SRC_ROOT" in
            "$GITHUB_WORKSPACE/project/"*)
              rsync -a --exclude='.github/' "$SRC_ROOT"/ "$GITHUB_WORKSPACE"/
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -A
              if ! git diff --cached --quiet; then
                git commit -m "Promote verified VPNcontrol 0.6.0 ARM64 Android sources"
                git push
              fi
              ;;
            *)
              echo "Android sources already live in repository root."
              ;;
          esac

      - name: Find APK
        id: apk
        shell: bash
        env:
          SRC_ROOT: ${{ steps.source.outputs.dir }}
        run: |
          set -euo pipefail
          APK="$(find "$SRC_ROOT" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          test -n "$APK" || { echo "ERROR: Debug APK was not produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK: $APK"

      - name: Prepare direct APK release asset
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          cp "$APK_PATH" "$GITHUB_WORKSPACE/VPN-Control.apk"
          test -s "$GITHUB_WORKSPACE/VPN-Control.apk"
          file "$GITHUB_WORKSPACE/VPN-Control.apk"

      - name: Publish direct APK download on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          name: VPNcontrol 0.6.0
          body: |
            Готовый установочный APK для Android (ARM64).

            Скачивайте файл VPN-Control.apk ниже. ZIP с исходниками устанавливать не нужно.
          files: VPN-Control.apk
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
